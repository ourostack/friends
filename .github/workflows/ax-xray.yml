name: AX X-ray

# Ouro AX's X-ray against friends' stdio MCP server, and the action claims over its ouro-actions declarations, on every
# pull request and on main. Each report is uploaded as an artifact whose name contains "xray", for the adoption ledger.
# The ax-census job counts every agent door friends has and fails when one without a valid card is new.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax-xray-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ax-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The inventory is the server's own tools/list, so a tool it serves without a declaration, or a declaration it
      # doesn't serve, fails the X-ray's inventory claim.
      - name: Inventory from the live tools/list
        run: |
          mkdir -p xray
          DIR="$RUNNER_TEMP/xray-home/friends"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node dist/mcp/bin.js --dir "$DIR" | jq '.result' > xray/tools-list.json
          jq '{mcp: [.tools[].name]}' xray/tools-list.json > xray/inventory.json

      # Exits 0 only when the server conforms, and writes the report to xray/report.json.
      - name: Ouro AX X-ray
        run: |
          set -o pipefail
          node lib/ouro-ui/registry/ouro/ax/xray.ts \
            --mcp "node $PWD/dist/mcp/bin.js --dir $RUNNER_TEMP/xray-home/friends" \
            --inventory xray/inventory.json --conformance \
            --home "$RUNNER_TEMP/xray-home" --timeout 60000 \
            --commit "$GITHUB_SHA" --json --md xray/xray.md > xray/report.json

      - name: Action claims over the declarations
        run: |
          mkdir -p xray-actions
          node tools/ouro-actions/ouro-actions.mts check actions/friends.actions.mts actions/generated \
            --report xray-actions/report.json --app "friends" --commit "$GITHUB_SHA"
          node -e "const s = require('./xray-actions/report.json').summary; if (!s) process.exit(1); if (s.mustHolding !== s.must) { console.error('Action claims: ' + s.mustHolding + ' of ' + s.must + ' must claims hold'); process.exit(1); }"

      - name: Upload the X-ray
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: xray
          path: xray/
          retention-days: 90

      - name: Upload the action claims
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: actions-xray
          path: xray-actions/
          retention-days: 90

  ax-census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The census (vendored from Ouro UI under lib/ouro-ui/scripts/ouro-census) and friends' walker (ax/walkers) read
      # TypeScript's syntax tree with the repository's own typescript.
      - name: Install Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck friends' census walker
        run: npx tsc -p ax/tsconfig.json

      - name: Friends' census walker tests
        run: |
          node --test --test-concurrency=3 --experimental-test-coverage \
            --test-coverage-include='ax/walkers/*.mts' --test-coverage-exclude='ax/walkers/*.node-test.mts' \
            --test-coverage-lines=100 --test-coverage-functions=100 --test-coverage-branches=85 \
            'ax/walkers/*.node-test.mts'

      # The census counts every agent door friends' walkers find (the MCP tools the server serves, and the CLI entry
      # points under src) and fails when one without a valid card isn't on ax/census.baseline.json, when this pull
      # request adds to the baseline, or when it drops a walker source. It compares with the base commit the checked-out
      # merge ref was built on, not the base branch's tip, which can have moved since. There is no override.
      - name: Ouro AX census
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p ax-census
          base_baseline=none; base_config=absent
          if [ -n "$BASE_REF" ]; then
            base_sha=$(node lib/ouro-ui/scripts/ouro-census/base.mts)
            git fetch --depth=1 origin "$base_sha"
            if git show FETCH_HEAD:ax/census.config.json > "$RUNNER_TEMP/base-config.json" 2>/dev/null; then base_config="$RUNNER_TEMP/base-config.json"; fi
            if git show FETCH_HEAD:ax/census.baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then base_baseline="$RUNNER_TEMP/base-baseline.json"; fi
          fi
          node lib/ouro-ui/scripts/ouro-census/census.mts --config ax/census.config.json --baseline ax/census.baseline.json \
            --base-baseline "$base_baseline" --base-config "$base_config" \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --repo "$GITHUB_REPOSITORY" --out ax-census/census.json \
            --inventory ax-census/inventory.json 2>&1 | tee ax-census/census.txt

      - name: Upload the census
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ax-census
          path: ax-census/
          retention-days: 90
          if-no-files-found: warn
